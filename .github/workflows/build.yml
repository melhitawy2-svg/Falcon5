name: Build Falcon APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          rm -rf app_src
          mkdir app_src
          unzip -o FalconVPN.zip -d app_src
          echo "=== ALL FILES ==="
          find app_src -type f | head -n 200
          ls -la app_src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build APK
        run: |
          cd app_src
          PUB=$(find . -name "pubspec.yaml" | head -n 1)
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          
          echo "Found pubspec: $PUB"
          echo "Found gradlew: $GRADLEW"
          
          if [ ! -z "$PUB" ]; then
            echo ">>> Flutter project"
            cd $(dirname "$PUB")
            flutter pub get
            flutter build apk --debug
          elif [ ! -z "$GRADLEW" ]; then
            echo ">>> Android project"
            cd $(dirname "$GRADLEW")
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo ">>> No pubspec or gradlew found, showing structure"
            find . | head -n 300
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon5-APK
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk

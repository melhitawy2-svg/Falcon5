name: Build Falcon APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip App
        run: |
          unzip FalconVPN.zip -d app_src || true
          ls -la
          ls -la app_src || true
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd app_src
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No gradlew found, trying with gradle"
            gradle assembleDebug || ./gradlew assembleDebug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon5-APK
          path: "**/build/outputs/apk/debug/*.apk"

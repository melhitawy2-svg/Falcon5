name: Build Falcon APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List ZIP contents
        run: |
          echo "=== What's in FalconVPN.zip ==="
          unzip -l FalconVPN.zip | head -n 100
          echo "=== Unzipping ==="
          unzip -o FalconVPN.zip
          echo "=== Full structure ==="
          ls -la
          find . -type f | head -n 100

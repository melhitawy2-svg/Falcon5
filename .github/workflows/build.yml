name: Build Falcon APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and find project
        run: |
          unzip -o FalconVPN.zip
          echo "=== structure ==="
          find . -type f -name "gradlew" -o -name "build.gradle" | head -n 20
          ls -la
          
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon5-APK
          path: "**/build/outputs/apk/debug/*.apk"
